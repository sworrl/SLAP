<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAP - Documentation</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <style>
        :root {
            --primary: #00d4ff;
            --primary-dark: #00a8cc;
            --secondary: #6366f1;
            --bg-dark: #0a0a0f;
            --bg-card: rgba(20, 20, 30, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(0, 212, 255, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 100%, rgba(99, 102, 241, 0.12) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .back-link {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .back-link:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: var(--primary);
        }

        .doc-list {
            list-style: none;
            padding: 0;
        }

        .doc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
        }

        .doc-item:hover {
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.05);
        }

        .doc-info {
            flex: 1;
        }

        .doc-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .doc-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .doc-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-pdf { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge-md { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge-txt { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .badge-html { background: rgba(99, 102, 241, 0.2); color: #818cf8; }

        .loading {
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-dim);
            padding: 40px;
        }

        /* PDF viewer */
        .pdf-viewer {
            width: 100%;
            height: 80vh;
            border: none;
            border-radius: 8px;
            background: #1a1a2e;
        }

        #viewerCard {
            display: none;
        }

        .viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .viewer-header h2 {
            margin-bottom: 0;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            color: white;
        }

        .btn-secondary {
            background: rgba(100, 116, 139, 0.3);
            border: 1px solid rgba(100, 116, 139, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(100, 116, 139, 0.5);
        }

        .btn-primary {
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: var(--primary);
        }

        .btn-primary:hover {
            background: rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="back-link">Dashboard</a>
        <h1>Documentation</h1>
        <p class="subtitle">Reference materials & protocol documentation</p>
    </div>

    <div class="container">
        <!-- Document List -->
        <div class="card" id="listCard">
            <h2>Available Documents</h2>
            <div id="docList" class="loading">Loading documents...</div>
        </div>

        <!-- PDF/Document Viewer -->
        <div class="card" id="viewerCard">
            <div class="viewer-header">
                <h2 id="viewerTitle">Document</h2>
                <div>
                    <button class="btn btn-primary" onclick="openInNewTab()">Open in New Tab</button>
                    <button class="btn btn-secondary" onclick="closeViewer()">Close</button>
                </div>
            </div>
            <iframe id="docViewer" class="pdf-viewer"></iframe>
        </div>
    </div>

    <script>
        let currentDocUrl = '';

        async function loadDocs() {
            try {
                const resp = await fetch('/api/docs');
                const data = await resp.json();
                const container = document.getElementById('docList');

                if (!data.docs || data.docs.length === 0) {
                    container.innerHTML = '<div class="empty-state">No documentation files found in docs/ directory.</div>';
                    return;
                }

                let html = '<ul class="doc-list">';
                for (const doc of data.docs) {
                    const badge = doc.type === 'pdf' ? 'badge-pdf' :
                                  doc.type === 'md' ? 'badge-md' :
                                  doc.type === 'html' ? 'badge-html' : 'badge-txt';
                    const size = doc.size > 1024*1024
                        ? (doc.size / (1024*1024)).toFixed(1) + ' MB'
                        : (doc.size / 1024).toFixed(0) + ' KB';

                    html += `<a class="doc-item" href="#" onclick="openDoc('${doc.url}', '${doc.name}', '${doc.type}'); return false;">
                        <div class="doc-info">
                            <div class="doc-name">${doc.name}</div>
                            <div class="doc-meta">${doc.filename} &middot; ${size}</div>
                        </div>
                        <span class="doc-badge ${badge}">${doc.type}</span>
                    </a>`;
                }
                html += '</ul>';
                container.innerHTML = html;
            } catch (e) {
                document.getElementById('docList').innerHTML =
                    '<div class="empty-state">Failed to load documents: ' + e.message + '</div>';
            }
        }

        function openDoc(url, name, type) {
            currentDocUrl = url;
            document.getElementById('viewerTitle').textContent = name;
            document.getElementById('viewerCard').style.display = 'block';

            const viewer = document.getElementById('docViewer');
            if (type === 'pdf') {
                viewer.src = url;
            } else {
                viewer.src = url;
            }

            document.getElementById('viewerCard').scrollIntoView({ behavior: 'smooth' });
        }

        function closeViewer() {
            document.getElementById('viewerCard').style.display = 'none';
            document.getElementById('docViewer').src = '';
            currentDocUrl = '';
        }

        function openInNewTab() {
            if (currentDocUrl) {
                window.open(currentDocUrl, '_blank');
            }
        }

        loadDocs();
    </script>
</body>
</html>
